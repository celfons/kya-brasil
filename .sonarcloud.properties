# examples/quickstart/mandate-input.json is a sample input with throwaway test values (a credential id is a UUID,
# not a secret); rule json:S6418 flags the "credential_id" key.
# packages/study-kit/test/fixtures holds deliberately broken participant code for the kit's tests (a busy loop, a
# syntax error, verifiers that skip the cryptography); none of it is shipped (the package publishes dist only).
sonar.exclusions=examples/quickstart/*.json,packages/study-kit/test/fixtures/**
