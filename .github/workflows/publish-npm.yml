# Publish @kya-brasil/core (the library, D-25), @kya-brasil/agent-tools (the client) and @kya-brasil/mcp (the local MCP
# server, D-31) to npm. Manual: needs the
# NPM_TOKEN secret (npm "automation" token) in the prod environment. Versions come from each package.json; bump
# them first. A version already on npm is skipped, so publishing one package never fails on the other.
# Then mirrors the same builds to GitHub Packages as @celfons/kya-core and @celfons/kya-agent-tools (GitHub
# requires the scope to be the repository owner), so both show under the repository's Packages. npmjs.com stays
# the install channel.
name: Publish npm package
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kya-brasil/core typecheck && pnpm --filter @kya-brasil/core test && pnpm --filter @kya-brasil/core build
      - run: pnpm --filter @kya-brasil/agent-tools typecheck && pnpm --filter @kya-brasil/agent-tools test && pnpm --filter @kya-brasil/agent-tools build
      - run: pnpm --filter @kya-brasil/mcp typecheck && pnpm --filter @kya-brasil/mcp test && pnpm --filter @kya-brasil/mcp build && pnpm --filter @kya-brasil/mcp smoke
      - name: Publish @kya-brasil/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret missing in the prod environment"; exit 1; fi
          # In the workspace the package points at its TypeScript sources; the published one at the build.
          node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.main="./dist/index.js";p.types="./dist/index.d.ts";p.exports={".":{types:"./dist/index.d.ts",import:"./dist/index.js"}};require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
          cp ../../LICENSE .
          node --input-type=module -e 'const m=await import("./dist/index.js"); if(!m.checkAction||!m.verifyIcpSignature||!m.hashPaymentRef) process.exit(1)'
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@kya-brasil/core@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@kya-brasil/core@$VERSION is already on npm; bump the version to publish a new one"
          else
            npm publish --access public --provenance
          fi
      - name: Publish
        working-directory: packages/agent-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret missing in the prod environment"; exit 1; fi
          # The client depends on the core published just before it: replace the workspace range with the real version.
          CORE=$(node -p "require('../core/package.json').version")
          node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.dependencies["@kya-brasil/core"]="^"+process.argv[1];require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$CORE"
          VERSION=$(node -p "require('./package.json').version")
          # A published version can never be replaced: skip (and still mirror below) instead of failing.
          if npm view "@kya-brasil/agent-tools@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@kya-brasil/agent-tools@$VERSION is already on npm; bump the version to publish a new one"
          else
            # Provenance (signed build attestation) needs a public source repository, which this one is.
            npm publish --access public --provenance
          fi
          # Placeholder npm left from the first publish (scope did not exist yet); unpublish is allowed within 72 h, ignore otherwise.
          npm unpublish @kya-brasil/agent-tools@0.0.0-stage 2>/dev/null || true
      - name: Publish the MCP server
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret missing in the prod environment"; exit 1; fi
          # Self-contained bundle (dist/index.js): the workspace devDependencies are not installed by users.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@kya-brasil/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@kya-brasil/mcp@$VERSION is already on npm; bump the version to publish a new one"
          else
            npm publish --access public --provenance
          fi
      - name: Mirror the core to GitHub Packages
        working-directory: packages/core
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@celfons/kya-core
          npm config set //npm.pkg.github.com/:_authToken "$GH_PACKAGES_TOKEN" --location project
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@celfons/kya-core@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@celfons/kya-core@$VERSION is already on GitHub Packages"
          else
            npm publish --registry https://npm.pkg.github.com
          fi
      - name: Mirror the client to GitHub Packages
        working-directory: packages/agent-tools
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@celfons/kya-agent-tools
          npm config set //npm.pkg.github.com/:_authToken "$GH_PACKAGES_TOKEN" --location project
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@celfons/kya-agent-tools@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@celfons/kya-agent-tools@$VERSION is already on GitHub Packages"
          else
            npm publish --registry https://npm.pkg.github.com
          fi
