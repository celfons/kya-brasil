# Everything automatic. On every merge to main (or manual run), for each stack (dev, prod):
#   create the Pulumi stack if missing → write its config from the GitHub environment's secrets/vars →
#   pulumi up → upload the ICP-Brasil anchors to KV → smoke test → rollback on failure.
# A stack is skipped when its environment has no PAY_TO secret. Nothing is ever run from a laptop.
#
# Required secrets per environment: PULUMI_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# PAY_TO. Optional: INTERNAL_API_KEY (fiat channel), CDP_API_KEY_ID / CDP_API_KEY_SECRET (mainnet facilitator).
# Optional vars: WORKER_NAME, CNPJ_API_URL (own registration endpoint, D-23), X402_NETWORK, FACILITATOR_URL, ISSUER_URL, GLAMA_CLAIM.
name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stack: [dev, prod]
    environment: ${{ matrix.stack }}
    permissions:
      id-token: write   # MCP Registry login via GitHub OIDC (proves the io.github.<owner> namespace)
      contents: read
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAY_TO: ${{ secrets.PAY_TO }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
      CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      WORKER_NAME: ${{ vars.WORKER_NAME || (matrix.stack == 'prod' && 'kya-br-agents' || 'kya-br-agents-dev') }}
      X402_NETWORK: ${{ vars.X402_NETWORK || (matrix.stack == 'prod' && 'eip155:8453' || 'eip155:84532') }}
      FACILITATOR_URL: ${{ vars.FACILITATOR_URL || (matrix.stack == 'prod' && 'https://api.cdp.coinbase.com/platform/v2/x402' || 'https://x402.org/facilitator') }}
      ISSUER_URL: ${{ vars.ISSUER_URL }}
      GLAMA_CLAIM: ${{ vars.GLAMA_CLAIM }}
      CNPJ_API_URL: ${{ vars.CNPJ_API_URL }}
    steps:
      - name: Environment configured?
        id: cfg
        run: |
          if [ -z "$PAY_TO" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PULUMI_ACCESS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::environment '${{ matrix.stack }}' lacks PAY_TO/CLOUDFLARE_API_TOKEN/PULUMI_ACCESS_TOKEN; skipping"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ready == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.cfg.outputs.ready == 'true'
      - name: Install Pulumi CLI
        if: steps.cfg.outputs.ready == 'true'
        run: bash scripts/install-pulumi.sh # pinned version, SHA-256 verified
      - name: Stack config from GitHub secrets
        if: steps.cfg.outputs.ready == 'true'
        working-directory: infra
        run: |
          pulumi login
          pulumi stack select --create ${{ matrix.stack }}
          # Restore Pulumi.<stack>.yaml from the last deployment first, so the signing key below is kept.
          pulumi config refresh --force 2>/dev/null || echo "no previous deployment to restore the config from"
          pulumi config set --secret cloudflare:apiToken "$CLOUDFLARE_API_TOKEN"
          pulumi config set kya-br-agents:accountId "$CLOUDFLARE_ACCOUNT_ID"
          pulumi config set kya-br-agents:workerName "$WORKER_NAME"
          pulumi config set kya-br-agents:x402Network "$X402_NETWORK"
          pulumi config set kya-br-agents:facilitatorUrl "$FACILITATOR_URL"
          pulumi config set --secret kya-br-agents:payTo "$PAY_TO"
          # Leftovers of the optional KYB source (removed in D-23).
          for k in kybWorkerName kybInternalKey registrationSource; do pulumi config rm "kya-br-agents:$k" 2>/dev/null || true; done
          if [ -n "$CNPJ_API_URL" ]; then pulumi config set kya-br-agents:cnpjApiUrl "$CNPJ_API_URL"; else pulumi config rm kya-br-agents:cnpjApiUrl 2>/dev/null || true; fi
          if [ -n "$ISSUER_URL" ]; then pulumi config set kya-br-agents:issuerUrl "$ISSUER_URL"; else pulumi config rm kya-br-agents:issuerUrl 2>/dev/null || true; fi
          if [ -n "$GLAMA_CLAIM" ]; then pulumi config set kya-br-agents:glamaClaim "$GLAMA_CLAIM"; else pulumi config rm kya-br-agents:glamaClaim 2>/dev/null || true; fi
          if [ -n "$INTERNAL_API_KEY" ]; then pulumi config set --secret kya-br-agents:internalApiKey "$INTERNAL_API_KEY"; else pulumi config rm kya-br-agents:internalApiKey 2>/dev/null || true; fi
          if [ -n "$CDP_API_KEY_ID" ] && [ -n "$CDP_API_KEY_SECRET" ]; then
            pulumi config set --secret kya-br-agents:cdpApiKeyId "$CDP_API_KEY_ID"
            pulumi config set --secret kya-br-agents:cdpApiKeySecret "$CDP_API_KEY_SECRET"
          else pulumi config rm kya-br-agents:cdpApiKeyId 2>/dev/null || true; pulumi config rm kya-br-agents:cdpApiKeySecret 2>/dev/null || true; fi
          # Credential signing key: generated once per stack and kept in the (encrypted) stack config.
          if pulumi config get kya-br-agents:attestPrivateKey >/dev/null 2>&1; then
            echo "signing key for ${{ matrix.stack }} restored from the last deployment"
          else
            node ../scripts/gen-attest-key.mjs | pulumi config set --secret kya-br-agents:attestPrivateKey
            echo "::warning::generated a NEW signing key for ${{ matrix.stack }}: credentials signed before this deploy no longer verify"
          fi
          if [ "${{ matrix.stack }}" = "prod" ] && [ "$X402_NETWORK" = "eip155:8453" ] && [ -z "$CDP_API_KEY_ID" ]; then
            echo "::error::prod on mainnet needs CDP_API_KEY_ID/CDP_API_KEY_SECRET"; exit 1; fi
      - name: Pulumi up
        if: steps.cfg.outputs.ready == 'true'
        working-directory: infra
        run: pulumi up --yes --stack ${{ matrix.stack }}
      - name: Resolve public URL
        if: steps.cfg.outputs.ready == 'true'
        id: url
        working-directory: infra
        run: |
          SCRIPT=$(pulumi stack output scriptName --stack ${{ matrix.stack }})
          KV=$(pulumi stack output kvNamespaceId --stack ${{ matrix.stack }})
          curl --proto '=https' --tlsv1.2 -fsS -o "$RUNNER_TEMP/subdomain.json" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).result.subdomain; if(!/^[a-z0-9-]+$/.test(s)) process.exit(1); console.log(s)' "$RUNNER_TEMP/subdomain.json")
          echo "base=https://$SCRIPT.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          echo "host=$SCRIPT.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          echo "kv=$KV" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.stack }} → https://$SCRIPT.$SUB.workers.dev"
      - name: ICP-Brasil trust anchors (ITI → KV icp:anchors)
        if: steps.cfg.outputs.ready == 'true'
        env:
          KV_NAMESPACE_ID: ${{ steps.url.outputs.kv }}
        run: |
          if [ -f anchors/icp-brasil.pem ]; then node scripts/icp-anchors.mjs --file anchors/icp-brasil.pem
          else node scripts/icp-anchors.mjs --all || node scripts/icp-anchors.mjs || echo "::warning::no anchors/icp-brasil.pem in the repo and the ITI site is unreachable from the runner; KV left as it was (no anchors = no issuance)"; fi
      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        id: smoke
        env:
          SMOKE_ALLOWED_HOSTS: ${{ steps.url.outputs.host }}
        run: node scripts/smoke.mjs "${{ steps.url.outputs.base }}"
      # Prod only: publishes io.github.celfons/kya-brasil when the remote URL or description changed.
      - name: Publish to MCP Registry (prod, only when changed)
        if: steps.cfg.outputs.ready == 'true' && steps.smoke.outcome == 'success' && matrix.stack == 'prod'
        run: |
          curl --proto '=https' --tlsv1.2 -fsS "${{ steps.url.outputs.base }}/server.json" > server.json
          NAME=$(node -pe 'require("./server.json").name')
          curl --proto '=https' --tlsv1.2 -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME&version=latest" > latest.json || echo '{"servers":[]}' > latest.json
          NEXT=$(node scripts/registry-version.mjs server.json latest.json)
          if [ "$NEXT" = "unchanged" ]; then echo "registry already up to date"; exit 0; fi
          node -e 'const f="server.json",j=require("./"+f);j.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j))' "$NEXT"
          cat server.json
          # Pinned mcp-publisher, HTTPS only, SHA-256 from the release's registry_<version>_checksums.txt.
          MCP_PUBLISHER_VERSION=1.8.1
          MCP_PUBLISHER_SHA256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl --proto '=https' --tlsv1.2 -fsSL -o mcp-publisher_linux_amd64.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: apps/worker
        run: |
          if npx wrangler rollback --name "$WORKER_NAME" --yes --message "CD smoke failed on ${{ github.sha }}"; then
            echo "::error::Smoke test failed on ${{ matrix.stack }}; rolled back $WORKER_NAME to the previous version"
          else
            echo "::error::Smoke test failed on ${{ matrix.stack }} and no previous version exists to roll back to; $WORKER_NAME stays on ${{ github.sha }}"
          fi
