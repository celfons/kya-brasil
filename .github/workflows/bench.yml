# Manual, full benchmark run (research/bench). Timings depend on the runner: compare medians on the same machine.
# Results go to the job summary (RESULTS.md) and the log (results.json); nothing is committed or uploaded.
name: Benchmark
on:
  workflow_dispatch:
    inputs:
      n:
        description: Iterations for fast operations (slow ones use fewer, stated in the table)
        required: false
        default: "1000"
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          BENCH_N: ${{ inputs.n }}
        run: pnpm --filter @kya-brasil/research-bench bench
      - name: Results to the job summary
        run: |
          cat research/bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n<details><summary>results.json</summary>\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat research/bench/results.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n</details>\n' >> "$GITHUB_STEP_SUMMARY"
