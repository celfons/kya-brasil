name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Worker bundle builds
        run: pnpm --filter @kya-br/worker build
  pulumi-preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: dev
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | sh -s && echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Preview (dev)
        if: env.PULUMI_ACCESS_TOKEN != ''
        working-directory: infra
        run: pulumi login && (pulumi stack select dev 2>/dev/null && pulumi preview --diff) || echo "dev stack not created yet; skipping preview"
