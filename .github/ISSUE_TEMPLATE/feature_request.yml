name: Feature request
description: A change to the issuer, the credential format or the client.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs it (verifier, company, agent developer) and what they cannot do today.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Changes to the credential, challenge, mandate or verification procedure start as a change to docs/SPEC.md.
